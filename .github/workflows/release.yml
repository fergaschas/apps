# Al publicar, editar o borrar una release, lanza "Web y catálogo" (pages.yml) sobre main.
#
# En los eventos de release, GitHub ejecuta el workflow tal como estaba en el commit
# del tag, que puede ser antiguo. Este archivo es mínimo para que eso no importe: la
# web siempre se genera con el pages.yml actual de main.

name: Release → web

on:
  release:
    types: [published, unpublished, edited, deleted]

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
