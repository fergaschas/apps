# Regenera el catálogo y la web, y los despliega en GitHub Pages.
#
# Se lanza al publicar, editar o borrar una release, al hacer push a main y a mano.
# Las releases que crea la CI de las apps con su token de grano fino (KAN-197) sí
# lanzan este workflow; las creadas con el GITHUB_TOKEN de otro workflow, no.

name: Web y catálogo

on:
  push:
    branches: [main]
  release:
    types: [published, unpublished, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez. Si llegan varios mientras tanto, solo corre el último.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Siempre main: en el evento release, el ref es el tag, que puede apuntar a un commit viejo.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Pruebas
        run: npm test

      - name: Descargar los manifest.json de las releases
        run: node scripts/fetch-manifests.mjs --repo "$GITHUB_REPOSITORY" --out manifests
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generar la web
        run: node scripts/build-site.mjs --manifests manifests --out _site --skip-invalid

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages usa GITHUB_SHA como versión del despliegue, y Pages no cambia el
      # contenido si la versión se repite. Una release no crea commit, así que sin esto
      # la web se quedaba con el catálogo anterior. Se añade el id de la ejecución.
      - id: deployment
        uses: actions/deploy-pages@v5
        env:
          GITHUB_SHA: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
