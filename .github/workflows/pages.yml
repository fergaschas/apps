# Regenera el catálogo y la web, y los despliega en GitHub Pages.
#
# Se lanza al hacer push a main, a mano y, a través de release.yml, al publicar,
# editar o borrar una release. Las releases que crea la CI de las apps con su token
# de grano fino (KAN-197) sí lanzan release.yml; las creadas con el GITHUB_TOKEN de
# otro workflow, no.

name: Web y catálogo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Un solo despliegue a la vez. Si llegan varios mientras tanto, solo corre el último.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Pruebas
        run: npm test

      - name: Descargar los manifest.json de las releases
        run: node scripts/fetch-manifests.mjs --repo "$GITHUB_REPOSITORY" --out manifests
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generar la web
        run: node scripts/build-site.mjs --manifests manifests --out _site --skip-invalid

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # solo para crear el commit de la versión del despliegue
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Hace lo mismo que actions/deploy-pages, pero con una versión única por ejecución.
      # deploy-pages usa GITHUB_SHA como versión y Pages no cambia el contenido si la
      # versión se repite. Una release no crea commit, así que con deploy-pages la web
      # se quedaba con el catálogo del último push. La versión tiene que ser un commit
      # del repo, así que se crea uno fuera de cualquier rama (mismo árbol que main):
      # no aparece en el historial.
      - id: deployment
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;

            const { data: head } = await github.rest.git.getCommit({ owner, repo, commit_sha: context.sha });
            const { data: commit } = await github.rest.git.createCommit({
              owner, repo,
              message: `Despliegue de Pages (ejecución ${context.runId}, ${context.eventName})`,
              tree: head.tree.sha,
              parents: [context.sha],
            });
            const version = commit.sha;

            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: context.runId, name: 'github-pages',
            });
            if (artifacts.length !== 1) throw new Error(`Se esperaba un artefacto github-pages y hay ${artifacts.length}`);

            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo,
              artifact_id: artifacts[0].id,
              pages_build_version: version,
              oidc_token: await core.getIDToken(),
            });
            const id = deployment.status_url.split('/').pop();
            core.info(`Despliegue ${id} (versión ${version})`);

            const failed = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost', 'deployment_perms_error'];
            const deadline = Date.now() + 10 * 60 * 1000;
            while (Date.now() < deadline) {
              await new Promise((r) => setTimeout(r, 5000));
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id });
              core.info(`Estado: ${data.status}`);
              if (data.status === 'succeed') {
                core.setOutput('page_url', deployment.page_url);
                return;
              }
              if (failed.includes(data.status)) throw new Error(`El despliegue ha fallado: ${data.status}`);
            }
            throw new Error('El despliegue no ha terminado en 10 minutos');
